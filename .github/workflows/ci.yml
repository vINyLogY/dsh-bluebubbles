name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # native TS type stripping (>= 23.6) is the runtime contract
      # dsh plugin add forwards to pnpm verbatim; it must exist on PATH.
      - run: corepack enable && corepack prepare pnpm@latest --activate
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      # Integration: install THIS commit's tree into a throwaway profile through
      # the real consumer path and assert the bundle rows compose.
      - run: npm run test:integration

  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cohort: [legacy, next]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Install each exact runtime lock in isolation. The source stays at its
      # real checkout path; only its dependencies point to the selected cohort.
      - name: Install pinned runtime
        shell: bash
        run: |
          runtime_dir="$RUNNER_TEMP/dsh-runtime-${{ matrix.cohort }}"
          mkdir -p "$runtime_dir"
          cp test/runtime/${{ matrix.cohort }}/package*.json "$runtime_dir/"
          if [ '${{ matrix.cohort }}' = legacy ]; then
            npm ci --prefix "$runtime_dir" --ignore-scripts --legacy-peer-deps
          else
            npm ci --prefix "$runtime_dir" --ignore-scripts
          fi
          ln -s "$runtime_dir/node_modules" node_modules
          echo "DSH_RUNTIME_NODE_MODULES=$runtime_dir/node_modules" >> "$GITHUB_ENV"
          echo "DSH_RUNTIME_COHORT=${{ matrix.cohort }}" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:runtime

  chat-completions-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The optional adapter is target-only. Install two locked cohorts, but
      # source imports resolve ONLY next; legacy is an explicit oracle path.
      - name: Install target runtime and independent legacy oracle
        shell: bash
        run: |
          target_dir="$RUNNER_TEMP/chat-compat-next"
          oracle_dir="$RUNNER_TEMP/chat-compat-legacy"
          mkdir -p "$target_dir" "$oracle_dir"
          cp test/runtime/next/package*.json "$target_dir/"
          cp test/runtime/legacy/package*.json "$oracle_dir/"
          npm ci --prefix "$target_dir" --ignore-scripts
          npm ci --prefix "$oracle_dir" --ignore-scripts --legacy-peer-deps
          ln -s "$target_dir/node_modules" node_modules
          echo "DSH_LEGACY_NODE_MODULES=$oracle_dir/node_modules" >> "$GITHUB_ENV"
      - name: Typecheck public target adapter contracts
        run: npm run typecheck --prefix compat/chat-completions
      - name: Compare actual legacy wire and target adapter
        shell: bash
        run: env -i PATH="$PATH" DSH_LEGACY_NODE_MODULES="$DSH_LEGACY_NODE_MODULES" npm run test:chat-compat
      - name: Boot shipped profile twice and cold-resume synthetic bindings
        shell: bash
        run: env -i PATH="$PATH" DSH_LEGACY_NODE_MODULES="$DSH_LEGACY_NODE_MODULES" npm run test:chat-compat-profile
